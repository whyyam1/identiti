# Deploy to Railway on every push to main.
#
# Why this exists instead of Railway's GitHub integration:
# the repo is owned by `whyyam1`, but the Railway account is connected as
# `iamkn1ght`. GitHub App installations are scoped to the repo OWNER, so
# Railway cannot enumerate this repo under that identity (collaborator access
# does not help). Authenticating with a Railway *project token* sidesteps the
# GitHub account linkage entirely.
#
# One-time setup:
#   1. Railway -> project -> Settings -> Tokens -> create a project token
#      (scoped to the `production` environment).
#   2. GitHub -> repo Settings -> Secrets and variables -> Actions ->
#      New repository secret -> name: RAILWAY_TOKEN, value: <the token>
#
# If that secret is missing the job FAILS LOUDLY. It used to skip quietly, which
# recreated the exact problem this workflow was built to solve: on 26 Oct 2026 a
# push appeared to succeed, the job went green, and nothing deployed — live stayed
# on 0.1.4 while main carried 0.1.5. A deploy pipeline that reports success
# without deploying is worse than no pipeline.

name: Deploy to Railway

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: railway-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Require RAILWAY_TOKEN
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          if [ -z "$RAILWAY_TOKEN" ]; then
            echo "::error::RAILWAY_TOKEN is not set, so this push would NOT deploy."
            echo "Create a project token: Railway > project > Settings > Tokens (scope: production)."
            echo "Store it: GitHub > repo Settings > Secrets and variables > Actions > New repository secret, named RAILWAY_TOKEN."
            exit 1
          fi

      - name: Read expected version
        id: expected
        run: |
          v=$(node -p "require('./package.json').version")
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "Expecting the live rail to report version $v after deploy."

      - name: Install Railway CLI
        run: npm i -g @railway/cli

      - name: Deploy
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: railway up --service identiti --detach

      # Verify the DEPLOYED VERSION, not just that something answers. The old
      # check grepped for '"status":"ok"', which /v1/health returns
      # unconditionally — it is a static response that does not even touch the
      # database (src/routes/health.ts). That check passed while nothing had
      # deployed, which is how 0.1.5 sat undeployed with a green tick.
      #
      # Known limit: if a push does NOT bump package.json, live already equals
      # expected and this passes immediately, so a failed rollout of an
      # unversioned change still goes unnoticed. Bump the version on anything
      # you need to confirm is live. Closing that properly needs either a build
      # id on /v1/health or dropping --detach so the CLI blocks on the build.
      - name: Verify deployed version
        env:
          EXPECTED: ${{ steps.expected.outputs.version }}
        run: |
          echo "Waiting for the live rail to report $EXPECTED ..."
          for i in $(seq 1 40); do
            body=$(curl -fsS https://identiti-production.up.railway.app/v1/health || true)
            live=$(echo "$body" | sed -n 's/.*"version":"\([^"]*\)".*/\1/p')
            if [ "$live" = "$EXPECTED" ]; then
              echo "Deployed: live version is $live"
              exit 0
            fi
            echo "  attempt $i: live=${live:-<no response>} expected=$EXPECTED"
            sleep 15
          done
          echo "::error::Live version never reached $EXPECTED (last seen: ${live:-<no response>}). The build did not roll out — check the Railway deploy logs."
          exit 1
